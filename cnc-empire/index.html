<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNC Empire">
<title>CNC EMPIRE – Span zu Cash</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f9fc;background:#07101f;--a:#ff9c2a;--m:#9fb0c8;--p:#12243d;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 10% 0,#ff9c2a1f,transparent 30%),linear-gradient(#0b182a,#060d18);padding:max(env(safe-area-inset-top),10px) 12px calc(92px + env(safe-area-inset-bottom));touch-action:manipulation}.app{max-width:620px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}.brand{font-weight:900}.brand small{display:block;color:var(--m);font-size:11px;margin-top:2px}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:99px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:linear-gradient(180deg,#172b47f5,#0d1b30f5);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 38px #0005}.stat{padding:12px}.label{color:var(--m);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.06em}.value{font-size:20px;font-weight:900;margin-top:4px}.sub{font-size:10px;color:var(--m);margin-top:3px}.hero{padding:16px;margin-top:10px}.machine{display:flex;gap:12px;align-items:center}.chuck{width:76px;height:76px;border-radius:22px;background:conic-gradient(#ffad43 0 12deg,#31465f 12deg 116deg,#ffad43 116deg 128deg,#31465f 128deg 232deg,#ffad43 232deg 244deg,#31465f 244deg);border:8px solid #8192a6;box-shadow:inset 0 0 0 10px #0d1927}.machine h2{font-size:18px;margin:0 0 4px}.machine p{font-size:11px;color:var(--m);margin:0;line-height:1.4}.tap{width:100%;margin-top:16px;min-height:76px;border:0;border-radius:18px;background:linear-gradient(#ffd071,#ff9823);color:#241503;font-size:18px;font-weight:950;box-shadow:0 7px 0 #b85a0c;transition:.06s}.tap:active{transform:translateY(5px);box-shadow:0 2px 0 #b85a0c}.section{font-size:16px;font-weight:900;margin:19px 3px 9px}.list{display:grid;gap:9px}.item{padding:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:850;font-size:13px}.desc{font-size:10px;color:var(--m);margin-top:3px}.rate{font-size:11px;color:#64dfa1;font-weight:800}.btn{border:0;border-radius:12px;padding:9px 11px;font-weight:900;background:#f7f9fc;color:#0d1928}.btn:disabled{background:#2b3b50;color:#6f8199}.secondary{background:#1f395b;color:#b9dcff;border:1px solid #5ea8ff44}.danger{background:#4d2630;color:#ffb3b3}.progress{height:9px;background:#08111f;border-radius:99px;overflow:hidden;margin:11px 0 7px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff9c2a,#ffd27a)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,620px);display:grid;grid-template-columns:repeat(4,1fr);background:#091426ee;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:transparent;border:0;color:#7890af;font-size:10px;font-weight:800;padding:7px 3px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav .on{color:#ffb44f}.field{width:100%;background:#081421;border:1px solid var(--line);color:white;border-radius:12px;padding:11px;margin-top:8px}.code{word-break:break-all;font-family:ui-monospace,monospace;font-size:9px;background:#06101c;padding:10px;border-radius:10px;color:#b9c9dd}.leader{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff12}.leader:last-child{border:0}.score{font-weight:900}.muted{color:var(--m);font-size:10px}.notice{padding:11px 12px;border:1px solid #5ea8ff44;background:#153250;color:#cfe8ff;border-radius:14px;font-size:11px;margin-bottom:10px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#101b2a;color:white;padding:10px 14px;border-radius:12px;font-weight:800;font-size:12px;z-index:9}.duel{text-align:center;padding:16px}.duelbig{font-size:44px;font-weight:950;margin:8px}.duelbtn{width:190px;height:190px;border-radius:50%;border:8px solid #ffffff33;background:linear-gradient(#ffc566,#f08018);font-weight:950;font-size:18px;color:#261500}@media(min-width:700px){body{padding-top:20px}}
</style>
</head>
<body><div id="root" class="app"></div><div id="nav" class="nav"></div>
<script>
(()=>{
const K='cncEmpireMobileV1';
const machines=[
['manual','Konventionelle Drehbank',0,0,'🛠️'],['cnc','CNC-Drehmaschine',450,4,'⚙️'],['bar','Stangenlader-Zelle',3500,24,'🔩'],['turnmill','Dreh-Fräszentrum',18000,110,'🧰'],['robot','Roboterzelle',95000,520,'🤖'],['lights','Lights-Out Fertigung',550000,2900,'🏭']];
const fresh=()=>({name:'Meine Werkstatt',money:120,lifetime:120,week:0,prestige:0,run:0,tap:1,m:{manual:1,cnc:0,bar:0,turnmill:0,robot:0,lights:0},friends:[],last:Date.now(),order:null,duelBest:0});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{s=fresh()}for(const x of machines)if(s.m[x[0]]==null)s.m[x[0]]=0;
let tab='shop',duel=null;
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:n<100?2:0}).format(n);
const num=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(n);
function save(){s.last=Date.now();localStorage.setItem(K,JSON.stringify(s))}
function mult(){return 1+s.prestige*.12}
function auto(){return machines.reduce((a,x)=>a+s.m[x[0]]*x[3],0)*mult()}
function click(){return s.tap*mult()}
function cost(x){let lv=s.m[x[0]];return x[2]===0?0:Math.floor(x[2]*Math.pow(1.18,lv))}
function add(v,score=true){s.money+=v;s.lifetime+=v;if(score)s.week+=v*.12}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function buy(id){let x=machines.find(z=>z[0]===id),c=cost(x);if(s.money<c)return toast('Zu wenig Kapital');s.money-=c;s.m[id]++;s.week+=c*.04;save();render()}
function tap(){if(duel){duel.score++;render();return}add(click());if(s.order)s.order.done++;save();render()}
function orderNew(){let mats=['1.4404','42CrMo4','Al 7075','1.4301','POM-C'];let names=['Präzisionswellen','Flanschserie','Hydraulikhülsen','Distanzringe','Spindelmuttern'];let q=30+Math.floor(Math.random()*71),pay=Math.round((180+auto()*12+click()*18)*(1+Math.random()*1.7));s.order={name:names[Math.floor(Math.random()*names.length)],mat:mats[Math.floor(Math.random()*mats.length)],q,done:0,pay};save();render()}
function claim(){if(!s.order||s.order.done<s.order.q)return;add(s.order.pay);s.week+=s.order.pay*.35;toast('Auftrag abgerechnet');s.order=null;save();render()}
function prestige(){if(s.lifetime<250000)return toast('Ab 250.000 € Gesamtumsatz');let gain=Math.max(1,Math.floor(Math.sqrt(s.lifetime/250000)));if(!confirm('Meisterlauf neu starten? Du erhältst '+gain+' Meistersterne.'))return;let keep={name:s.name,prestige:s.prestige+gain,run:s.run+1,friends:s.friends,duelBest:s.duelBest,lifetime:s.lifetime};s={...fresh(),...keep};save();render()}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,n:s.name,w:Math.round(s.week),p:s.prestige,d:s.duelBest}))))}
function importCode(){let v=document.getElementById('friendcode').value.trim();try{let o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.n)throw 0;let i=s.friends.findIndex(f=>f.n===o.n);if(i>=0)s.friends[i]=o;else s.friends.push(o);save();toast('Freund aktualisiert');render()}catch{toast('Code ungültig')}}
function copyCode(){navigator.clipboard?.writeText(code());toast('Werkstattcode kopiert')}
function startDuel(){duel={score:0,left:20};render();let t=setInterval(()=>{if(!duel)return clearInterval(t);duel.left--;if(duel.left<=0){clearInterval(t);s.duelBest=Math.max(s.duelBest,duel.score);toast('Schicht beendet: '+duel.score+' Teile');duel=null;save()}render()},1000)}
function offline(){let sec=Math.min(8*3600,Math.max(0,(Date.now()-(s.last||Date.now()))/1000));let v=auto()*sec;if(v>1){add(v,false);toast('Offline-Ertrag '+euro(v))}s.last=Date.now();save()}
function stats(){return `<div class="grid"><div class="card stat"><div class="label">Kontostand</div><div class="value">${euro(s.money)}</div><div class="sub">Gesamt ${euro(s.lifetime)}</div></div><div class="card stat"><div class="label">Automatisch</div><div class="value">${euro(auto())}/s</div><div class="sub">×${mult().toFixed(2)} Meisterbonus</div></div></div>`}
function shop(){let best=[...machines].reverse().find(x=>s.m[x[0]]>0)||machines[0];return `${stats()}<div class="card hero"><div class="machine"><div class="chuck"></div><div><h2>${best[1]}</h2><p>Tippe, fertige Teile, investiere in Automatisierung und baue deine Fertigung zum Konzern aus.</p></div></div><button class="tap" onclick="G.tap()">TEIL FERTIGEN<br><span style="font-size:11px">+ ${euro(click())}</span></button></div><div class="section">Maschinenpark</div><div class="list">${machines.slice(1).map(x=>`<div class="card item"><div class="row"><div><div class="name">${x[4]} ${x[1]}</div><div class="desc">Stufe ${s.m[x[0]]} · ${euro(x[3]*mult())}/s je Maschine</div></div><button class="btn" ${s.money<cost(x)?'disabled':''} onclick="G.buy('${x[0]}')">${euro(cost(x))}</button></div></div>`).join('')}</div><div class="section">Meisterprestige</div><div class="card item"><div class="row"><div><div class="name">★ Meisterlauf</div><div class="desc">Reset gegen dauerhaften Produktionsbonus. Aktuell +${Math.round((mult()-1)*100)} %.</div></div><button class="btn secondary" onclick="G.prestige()">Prestige</button></div></div>`}
function orders(){let o=s.order;return `${stats()}<div class="section">Fertigungsauftrag</div>${o?`<div class="card item"><div class="row"><div><div class="name">${o.name}</div><div class="desc">${o.mat} · ${o.q} Teile</div></div><div class="score">${euro(o.pay)}</div></div><div class="progress"><span style="width:${Math.min(100,o.done/o.q*100)}%"></span></div><div class="row"><span class="muted">${Math.floor(o.done)} / ${o.q}</span>${o.done>=o.q?'<button class="btn" onclick="G.claim()">Abrechnen</button>':'<button class="btn secondary" onclick="G.tap()">Teil fertigen</button>'}</div></div>`:`<div class="card item"><div class="desc" style="margin-bottom:10px">Keine Serie eingeplant.</div><button class="btn" onclick="G.orderNew()">Neuen Auftrag annehmen</button></div>`}<div class="section">Kennzahlen</div><div class="grid"><div class="card stat"><div class="label">Manuell</div><div class="value">${euro(click())}</div><div class="sub">pro Teil</div></div><div class="card stat"><div class="label">Teilefluss</div><div class="value">${auto().toFixed(1)}</div><div class="sub">Teile/s</div></div></div>`}
function board(){let all=[{n:s.name,w:s.week,p:s.prestige,d:s.duelBest,you:1},...s.friends,{n:'SpanKing',w:62000,p:2,d:91},{n:'FräsFuchs',w:34500,p:1,d:74}].sort((a,b)=>(b.w||0)-(a.w||0));let db=[...all].sort((a,b)=>(b.d||0)-(a.d||0));let rows=a=>a.map((p,i)=>`<div class="leader"><b>${i+1}</b><div><div class="name">${p.n}${p.you?' · DU':''}</div><div class="muted">${p.p||0} ★ Meister</div></div><div class="score">${num(p.w||0)}</div></div>`).join('');return `<div class="notice">Freundesliga funktioniert bereits per Werkstattcode. Live-Online-Sync kommt im nächsten Schritt.</div><div class="section">Wochenliga</div><div class="card item">${rows(all)}</div><div class="section">20-Sekunden-Schichtduell</div><div class="card duel"><div class="muted">${duel?'Noch '+duel.left+' Sekunden':'Bestwert '+s.duelBest+' Teile'}</div><div class="duelbig">${duel?duel.score:s.duelBest}</div>${duel?'<button class="duelbtn" onclick="G.tap()">TEIL FERTIG</button>':'<button class="btn" onclick="G.startDuel()">Duell starten</button>'}</div><div class="section">Duell-Ranking</div><div class="card item">${db.map((p,i)=>`<div class="leader"><b>${i+1}</b><div class="name">${p.n}${p.you?' · DU':''}</div><div class="score">${p.d||0}</div></div>`).join('')}</div>`}
function profile(){return `<div class="section">Werkstattprofil</div><div class="card item"><div class="name">Werkstattname</div><input id="nm" class="field" maxlength="22" value="${s.name.replaceAll('"','&quot;')}"><button class="btn" style="margin-top:8px" onclick="G.name()">Speichern</button></div><div class="section">Freundesliga</div><div class="card item"><div class="name">Dein Werkstattcode</div><div class="code" style="margin-top:8px">${code()}</div><button class="btn secondary" style="margin-top:8px" onclick="G.copyCode()">Code kopieren</button><textarea id="friendcode" class="field" rows="3" placeholder="Code eines Freundes einfügen"></textarea><button class="btn" onclick="G.importCode()">Freund hinzufügen</button></div><div class="section">Karriere</div><div class="grid"><div class="card stat"><div class="label">Meistersterne</div><div class="value">${s.prestige}</div><div class="sub">${s.run} Läufe</div></div><div class="card stat"><div class="label">Duellbestwert</div><div class="value">${s.duelBest}</div><div class="sub">Teile / 20 s</div></div></div><div class="section">System</div><div class="card item"><button class="btn danger" onclick="G.reset()">Spielstand löschen</button></div>`}
function render(){document.getElementById('root').innerHTML=`<div class="top"><div class="brand">CNC EMPIRE<small>Span zu Cash</small></div><div class="pill">★ ${s.prestige}</div></div>${tab==='shop'?shop():tab==='orders'?orders():tab==='board'?board():profile()}`;let n=[['shop','⚙️','Werkstatt'],['orders','📋','Aufträge'],['board','🏆','Rangliste'],['profile','👤','Profil']];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="G.tab('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
window.G={tap,buy,orderNew,claim,prestige,copyCode,importCode,startDuel,tab:x=>{if(!duel){tab=x;render()}},name:()=>{s.name=document.getElementById('nm').value.trim()||'Meine Werkstatt';save();toast('Name gespeichert');render()},reset:()=>{if(confirm('Spielstand wirklich löschen?')){localStorage.removeItem(K);location.reload()}}};
offline();render();setInterval(()=>{if(!duel){let v=auto();if(v){add(v);if(s.order)s.order.done+=Math.max(.1,auto()/8);save();render()}}},1000);
})();
</script></body></html>
