name: CNC Empire Smoke

on:
  push:
    branches: [cnc-empire-dev]
    paths:
      - 'cnc-empire/**'
      - '.github/workflows/cnc-empire-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core smoke checks
        run: node cnc-empire/tests/smoke.mjs
      - name: Run quality smoke checks
        run: node cnc-empire/tests/quality-smoke.mjs
